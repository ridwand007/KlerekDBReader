name: Build Klerek DB Reader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q KlerekDBReader-AndroidStudio.zip -d source

      - name: Build APK
        run: gradle -p source/KlerekDBReader assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KlerekDBReader-APK
          path: source/KlerekDBReader/app/build/outputs/apk/debug/app-debug.apk
